name: Fix bootstrap contracts

on:
  push:
    branches:
      - refactor/architectural-consolidation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-contract-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/architectural-consolidation
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply fixes
        run: node scripts/fix-bootstrap-contracts.mjs
      - name: Test contracts
        run: node --test test/acertos-financeiros.test.js test/auditoria-qa-ui.test.js test/phase3-telas.test.js test/phase4-polimento.test.js
      - name: Commit
        run: |
          git config user.name "lifeos-bootstrap-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/acertos-financeiros.test.js test/auditoria-qa-ui.test.js test/phase3-telas.test.js test/phase4-polimento.test.js
          git rm scripts/fix-bootstrap-contracts.mjs
          git commit -m "test: align bootstrap contracts [bootstrap-contract-bot]"
          git push origin HEAD:refactor/architectural-consolidation
