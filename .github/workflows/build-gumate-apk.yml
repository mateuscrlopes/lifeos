name: Compilar APK do Gumate

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-gumate/**'
      - '.github/workflows/build-gumate-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar modelo de portugues do Vosk
        run: bash android-gumate/scripts/baixar-modelo-vosk.sh

      - name: Compilar APK de teste
        working-directory: android-gumate
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: gumate-lab-debug
          path: android-gumate/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
