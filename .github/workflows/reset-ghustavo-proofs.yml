name: Reset Ghustavo test proofs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render and run one-time reset
        shell: bash
        run: |
          set -euo pipefail
          URL="https://lifeos-6rib.onrender.com/api/internal/reset-ghustavo-7e98143f-ec37-4e44-9338-bf15fdf50cd4"
          for i in $(seq 1 42); do
            code="$(curl -sS -L --max-time 20 -o /tmp/lifeos-reset.json -w '%{http_code}' "$URL" || true)"
            echo "attempt=$i http=$code"
            cat /tmp/lifeos-reset.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/lifeos-reset.json; then
              echo "LifeOS reset completed."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for one-time reset endpoint."
          exit 1
