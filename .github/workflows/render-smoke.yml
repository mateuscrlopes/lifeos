name: Render production smoke

on:
  push:
    branches:
      - "ops/render-smoke"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for LifeOS production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl --fail --silent --show-error --max-time 25 https://lifeos-6rib.onrender.com/saude || true)"
            echo "Tentativa $attempt: $body"
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"versao":"0.28.0"'; then
              echo "LifeOS 0.28.0 está saudável em produção."
              exit 0
            fi
            sleep 15
          done
          echo "Produção não confirmou a versão esperada a tempo."
          exit 1

      - name: Check protected acertos backend
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/acertos-response.json --write-out '%{http_code}'             --request POST             --header 'Content-Type: application/pdf'             --header 'x-lifeos-valor: 1.00'             --data-binary '%PDF-1.4 smoke'             https://lifeos-6rib.onrender.com/api/acertos/00000000-0000-0000-0000-000000000000/comprovante)"
          cat /tmp/acertos-response.json
          if [ "$code" != "401" ]; then
            echo "Esperava 401 sem sessão; recebido HTTP $code."
            exit 1
          fi
          echo "Backend privado de comprovantes está configurado e exige autenticação."


      - name: Check new UI assets
        shell: bash
        run: |
          set -euo pipefail
          for path in /acertos.js /acertos.css /theme.js /ghumat-refinement.css; do
            code="$(curl --silent --output /tmp/asset --write-out '%{http_code}' --max-time 25 "https://lifeos-6rib.onrender.com$path")"
            if [ "$code" != "200" ] || [ ! -s /tmp/asset ]; then
              echo "Falha ao carregar $path: HTTP $code"
              exit 1
            fi
          done
          home="$(curl --fail --silent --show-error --max-time 25 https://lifeos-6rib.onrender.com/)"
          echo "$home" | grep -q 'ghumat-refinement.css'
          echo "Assets financeiros e refinamento visual publicados."


      - name: Check split feedback deployment
        shell: bash
        run: |
          set -euo pipefail
          js="$(curl --fail --silent --show-error --max-time 25 https://lifeos-6rib.onrender.com/acertos.js)"
          css="$(curl --fail --silent --show-error --max-time 25 https://lifeos-6rib.onrender.com/acertos.css)"
          echo "$js" | grep -q "50% para cada"
          echo "$js" | grep -q "toLocaleLowerCase('pt-BR') !== 'casa'"
          echo "$js" | grep -q 'id="acHalf" checked'
          echo "$css" | grep -q '.ac-money-input'
          echo "Ajustes de divisão 50%, filtro Casa e campos monetários publicados."

# rerun after Render rollout
