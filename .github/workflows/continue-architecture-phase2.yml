name: Continue architecture phase 2

on:
  push:
    branches:
      - refactor/architectural-consolidation
    paths:
      - scripts/continue-architecture-phase2.mjs
      - .github/workflows/continue-architecture-phase2.yml

permissions:
  contents: write

jobs:
  owners-hoje-casa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/architectural-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic consolidation
        run: node scripts/continue-architecture-phase2.mjs

      - name: Test with diagnostic capture
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test > phase2-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat phase2-test.log
          exit 0

      - name: Upload test diagnostic
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phase2-test-diagnostic
          path: phase2-test.log
          retention-days: 1

      - name: Stop on test failure
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

      - name: Validate
        run: npm run check

      - name: Commit owners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: estabelece owners reais de Hoje e Casa"
          git push origin HEAD:refactor/architectural-consolidation
