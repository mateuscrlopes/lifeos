<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS</title>
  <style>
    :root { --fundo:#f5f6f8;--cartao:#ffffff;--texto:#1f2430;--suave:#6b7280;--linha:#e5e7eb;--acao:#2f6f4f;--acao-clara:#e7f1eb;--perigo:#b23c3c; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
    .envolto{max-width:560px;margin:0 auto;padding:24px 16px 64px;}
    header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
    header h1{font-size:22px;margin:0;letter-spacing:-0.02em;}
    header .quem{font-size:13px;color:var(--suave);}
    .cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:16px;}
    label{display:block;font-size:13px;color:var(--suave);margin-bottom:6px;}
    input,textarea{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;font-size:15px;background:#fff;color:var(--texto);}
    input:focus,textarea:focus{outline:2px solid var(--acao-clara);border-color:var(--acao);}
    .campo{margin-bottom:12px;}
    button{font-size:15px;font-weight:600;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--acao);color:#fff;}
    button.secundario{background:var(--acao-clara);color:var(--acao);}
    button:disabled{opacity:.55;cursor:default;}
    .linha-add{display:flex;gap:8px;}
    .linha-add input{flex:1;}
    .item{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--linha);}
    .item:last-child{border-bottom:none;}
    .item .desc{display:flex;flex-direction:column;gap:2px;}
    .item .nome{font-size:15px;}
    .item .meta{font-size:12px;color:var(--suave);}
    .item button{background:var(--acao-clara);color:var(--acao);padding:7px 12px;font-size:13px;}
    .vazio{color:var(--suave);font-size:14px;text-align:center;padding:24px 0;}
    .aviso{font-size:13px;margin-top:10px;min-height:18px;}
    .aviso.erro{color:var(--perigo);}
    .aviso.ok{color:var(--acao);}
    .titulo-secao{font-size:13px;color:var(--suave);margin:4px 0 10px;text-transform:uppercase;letter-spacing:.04em;}
    .oculto{display:none;}
    .abas{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
    .aba{flex:1;min-width:55px;background:var(--cartao);color:var(--suave);border:1px solid var(--linha);font-weight:600;padding:9px 6px;font-size:12px;white-space:nowrap;}
    .aba.ativa{background:var(--acao);color:#fff;border-color:var(--acao);}
    .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;}
    .est-controles{display:flex;align-items:center;gap:6px;}
    .est-controles button{width:30px;height:30px;padding:0;font-size:17px;line-height:1;background:var(--acao-clara);color:var(--acao);}
    .est-qtd{min-width:26px;text-align:center;font-size:15px;}
    .saudacao{font-size:22px;font-weight:700;margin:4px 0 4px;letter-spacing:-0.02em;}
    .card-hoje-titulo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .card-hoje-titulo .abrir{font-size:12px;color:var(--acao);cursor:pointer;font-weight:600;}
    .mini-item{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--linha);font-size:14px;}
    .mini-item:last-child{border-bottom:none;}
    .mini-item .m-meta{font-size:12px;color:var(--suave);}
    .tudo-em-dia{text-align:center;padding:28px 0;color:var(--acao);font-size:15px;}
    .card-clicavel{cursor:pointer;}
    .card-clicavel:hover{border-color:var(--acao);}
    .sel{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;font-size:15px;background:#fff;color:var(--texto);}
    .check-tarefa{width:22px;height:22px;border-radius:6px;border:2px solid var(--linha);cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#fff;}
    .check-tarefa.feita{background:var(--acao);border-color:var(--acao);color:#fff;}
    .item.concluida .nome{text-decoration:line-through;color:var(--suave);}
    .modal-aberto{display:flex!important;}
    #modalInventario.oculto{pointer-events:none;}
    /* Cardapio */
    .grade-semana{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
    .dia-col{display:flex;flex-direction:column;gap:4px;}
    .dia-label{font-size:11px;font-weight:600;color:var(--suave);text-align:center;text-transform:uppercase;}
    .dia-slot{background:var(--fundo);border:1px dashed var(--linha);border-radius:8px;padding:6px;font-size:11px;min-height:48px;cursor:pointer;text-align:center;color:var(--suave);}
    .dia-slot.preenchido{background:var(--acao-clara);border-color:var(--acao);color:var(--acao);font-weight:600;}
    .card-refeicao{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--linha);}
    .card-refeicao:last-child{border-bottom:none;}
    .card-cardapio-hoje{display:flex;gap:12px;}
    .slot-hoje{flex:1;background:var(--fundo);border-radius:10px;padding:12px;text-align:center;}
    .slot-hoje .rotulo{font-size:11px;color:var(--suave);text-transform:uppercase;margin-bottom:4px;}
    .slot-hoje .prato{font-size:14px;font-weight:600;color:var(--texto);}
  </style>
</head>
<body>
<div class="envolto">
  <header><h1>LifeOS</h1><span class="quem" id="quem"></span></header>

  <section id="telaLogin" class="cartao">
    <div class="titulo-secao">Entrar</div>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com"/></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="sua senha"/></div>
    <button id="btnEntrar">Entrar</button>
    <div id="avisoLogin" class="aviso"></div>
  </section>

  <section id="telaApp" class="oculto">
    <nav class="abas">
      <button class="aba ativa" data-aba="hoje">Hoje</button>
      <button class="aba" data-aba="compras">Compras</button>
      <button class="aba" data-aba="estoque">Estoque</button>
      <button class="aba" data-aba="cardapio">Cardápio</button>
      <button class="aba" data-aba="tarefas">Tarefas</button>
      <button class="aba" data-aba="contas">Contas</button>
    </nav>

    <!-- HOJE -->
    <div id="abaHoje"><div id="saudacao" class="saudacao"></div><div id="cardsHoje"></div></div>

    <!-- COMPRAS -->
    <div id="abaCompras" class="oculto">
      <div class="cartao">
        <div class="titulo-secao">Adicionar à lista</div>
        <div class="linha-add"><input id="novoItem" type="text" placeholder="Ex.: leite"/><button id="btnAdd">Adicionar</button></div>
        <div id="avisoAdd" class="aviso"></div>
      </div>
      <div class="cartao"><div class="titulo-secao">Lista de compras</div><div id="itens"></div></div>
    </div>

    <!-- ESTOQUE -->
    <div id="abaEstoque" class="oculto">
      <div class="cartao">
        <div class="titulo-secao">Adicionar ao estoque</div>
        <div class="campo"><input id="estNome" type="text" placeholder="Nome, ex.: shampoo"/></div>
        <div class="campo"><label for="estLocal">Local</label>
          <select id="estLocal" class="sel">
            <option value="">— Sem local —</option>
            <option>Cozinha - Não perecíveis</option><option>Cozinha - Hortifruti</option>
            <option>Cozinha - Carnes</option><option>Cozinha - Café da manhã</option>
            <option>Cozinha - Temperos</option><option>Banheiro - Higiene pessoal</option>
            <option>Banheiro - Cosméticos</option><option>Banheiro - Limpeza</option>
            <option>Lavanderia</option><option>Casa - Limpeza</option>
            <option>Casa - Utilitários</option><option>Farmácia / Remédios</option>
          </select>
        </div>
        <div class="campo"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="estCritico" type="checkbox" style="width:auto"/>Item crítico (sempre entra no inventário)</label></div>
        <div class="campo"><label for="estTipo">Tipo de medição</label>
          <select id="estTipo" class="sel">
            <option value="contavel">Unidade contável</option>
            <option value="peso_volume">Peso / Volume</option>
            <option value="nivel_visual">Nível visual</option>
          </select>
        </div>
        <div id="estCamposNum">
          <div class="linha-add">
            <div style="flex:1"><label for="estQtd">Quantidade</label><input id="estQtd" type="number" min="0" step="any" value="0"/></div>
            <div style="flex:1"><label for="estMin">Mínimo</label><input id="estMin" type="number" min="0" step="any" value="1"/></div>
          </div>
          <div class="campo"><label for="estUnidade">Unidade</label><input id="estUnidade" type="text" placeholder="unidades"/></div>
        </div>
        <div id="estCamposNivel" class="oculto">
          <div class="linha-add">
            <div style="flex:1"><label for="estNivelAtual">Nível atual</label>
              <select id="estNivelAtual" class="sel"><option value="cheio">Cheio</option><option value="75">~75%</option><option value="metade">Metade</option><option value="25">~25%</option><option value="quase_acabando">Quase acabando</option><option value="acabou">Acabou</option></select>
            </div>
            <div style="flex:1"><label for="estNivelMin">Alertar abaixo de</label>
              <select id="estNivelMin" class="sel"><option value="75">~75%</option><option value="metade">Metade</option><option value="25" selected>~25%</option><option value="quase_acabando">Quase acabando</option></select>
            </div>
          </div>
        </div>
        <div style="margin-top:12px"><button id="btnAddEstoque">Adicionar ao estoque</button></div>
        <div id="avisoEstoque" class="aviso"></div>
      </div>
      <div class="cartao">
        <div class="card-hoje-titulo">
          <div class="titulo-secao">Itens em estoque</div>
          <button id="btnInventario" class="secundario" style="font-size:13px;padding:6px 12px">Fazer inventário</button>
        </div>
        <div id="itensEstoque"></div>
      </div>
    </div>

    <!-- CARDAPIO -->
    <div id="abaCardapio" class="oculto">
      <!-- Cadastro de refeicoes -->
      <div class="cartao">
        <div class="titulo-secao">Nova refeição</div>
        <div class="campo"><input id="refNome" type="text" placeholder="Ex.: Frango com batata"/></div>
        <div class="campo"><label for="refTipo">Serve para</label>
          <select id="refTipo" class="sel"><option value="almoco">Almoço (marmita)</option><option value="janta">Janta</option><option value="ambos">Ambos</option></select>
        </div>
        <div class="campo"><label for="refPorcoes">Porções</label><input id="refPorcoes" type="number" min="1" value="2"/></div>
        <div class="titulo-secao" style="margin-top:8px">Ingredientes</div>
        <div id="refIngredientes"></div>
        <button id="btnAddIngrediente" class="secundario" style="font-size:13px;padding:7px 12px;margin-bottom:12px">+ Ingrediente</button>
        <button id="btnSalvarRefeicao">Salvar refeição</button>
        <div id="avisoRefeicao" class="aviso"></div>
      </div>
      <!-- Lista de refeicoes -->
      <div class="cartao"><div class="titulo-secao">Refeições cadastradas</div><div id="listaRefeicoes"></div></div>
      <!-- Planejamento da semana -->
      <div class="cartao">
        <div class="card-hoje-titulo">
          <div class="titulo-secao">Cardápio da semana</div>
          <select id="planResp" class="sel" style="width:auto;padding:6px 10px;font-size:13px">
            <option value="ambos">Ambos</option><option value="mateus">Mateus</option><option value="ghustavo">Ghustavo</option>
          </select>
        </div>
        <div style="margin-bottom:6px">
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-bottom:4px">
            <div class="dia-label">Seg</div><div class="dia-label">Ter</div><div class="dia-label">Qua</div><div class="dia-label">Qui</div><div class="dia-label">Sex</div>
          </div>
          <div style="font-size:11px;color:var(--suave);margin-bottom:4px">Almoço</div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px" id="slotsAlmoco"></div>
          <div style="font-size:11px;color:var(--suave);margin:8px 0 4px">Janta</div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px" id="slotsJanta"></div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="btnSalvarPlan">Salvar cardápio</button>
          <button id="btnGerarLista" class="secundario">Gerar lista de compras</button>
        </div>
        <div id="avisoPlan" class="aviso"></div>
      </div>
    </div>

    <!-- TAREFAS -->
    <div id="abaTarefas" class="oculto">
      <div class="cartao">
        <div class="titulo-secao">Adicionar tarefa</div>
        <div class="campo"><input id="tfTitulo" type="text" placeholder="Ex.: Lavar roupa"/></div>
        <div class="linha-add">
          <div style="flex:1"><label for="tfResp">Responsável</label><select id="tfResp" class="sel"><option value="ambos">Ambos</option><option value="mateus">Mateus</option><option value="ghustavo">Ghustavo</option></select></div>
          <div style="flex:1"><label for="tfData">Data (opcional)</label><input id="tfData" type="date"/></div>
        </div>
        <div class="campo" style="margin-top:12px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="tfRecorrente" type="checkbox" style="width:auto"/>Repete (rotina)</label></div>
        <div id="tfRecorrenciaBox" class="campo oculto"><input id="tfRecorrencia" type="text" placeholder="Ex.: 2x/semana"/></div>
        <div><button id="btnAddTarefa">Adicionar tarefa</button></div>
        <div id="avisoTarefa" class="aviso"></div>
      </div>
      <div class="cartao"><div class="titulo-secao">Tarefas</div><div id="itensTarefas"></div></div>
    </div>

    <!-- CONTAS -->
    <div id="abaContas" class="oculto">
      <div class="cartao">
        <div class="titulo-secao">Adicionar conta</div>
        <div class="campo"><input id="ctNome" type="text" placeholder="Nome, ex.: Energia"/></div>
        <div class="linha-add">
          <div style="flex:1"><label for="ctValor">Valor (R$)</label><input id="ctValor" type="number" min="0" step="0.01" placeholder="opcional"/></div>
          <div style="flex:1"><label for="ctVenc">Vencimento</label><input id="ctVenc" type="date"/></div>
        </div>
        <div class="campo" style="margin-top:12px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="ctRecorrente" type="checkbox" style="width:auto"/>Repete todo mês</label></div>
        <div><button id="btnAddConta">Adicionar conta</button></div>
        <div id="avisoConta" class="aviso"></div>
      </div>
      <div class="cartao"><div class="titulo-secao">Contas</div><div id="itensContas"></div></div>
    </div>

    <div style="text-align:center;margin-top:8px"><button id="btnSair" style="background:none;color:var(--suave);font-weight:400;font-size:13px;padding:4px">Sair</button></div>

    <!-- Modal seletor de refeição para o cardápio -->
    <div id="modalRefeicao" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center" class="oculto">
      <div style="background:var(--cartao);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:80vh;overflow-y:auto;padding:20px">
        <div style="display:flex;justify-content:space-between;margin-bottom:16px">
          <strong id="modalRefTitulo">Escolha a refeição</strong>
          <button id="btnFecharModalRef" style="background:none;color:var(--suave);padding:4px 8px;font-size:20px">&times;</button>
        </div>
        <div class="campo"><input id="modalRefNomeAvulso" type="text" placeholder="Ou digite um nome avulso…"/></div>
        <div id="modalRefLista"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="btnConfirmarRef">Confirmar</button>
          <button id="btnLimparSlot" class="secundario">Limpar slot</button>
        </div>
      </div>
    </div>

    <!-- Modal inventário -->
    <div id="modalInventario" class="oculto" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center">
      <div style="background:var(--cartao);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <strong>Inventário rotativo</strong>
          <button id="btnFecharInventario" style="background:none;color:var(--suave);padding:4px 8px;font-size:20px">&times;</button>
        </div>
        <div id="invPassoLocal">
          <div class="titulo-secao">Escolha o ambiente</div>
          <select id="invLocal" class="sel" style="margin-bottom:12px">
            <option value="">— Selecione —</option>
            <option>Cozinha - Não perecíveis</option><option>Cozinha - Hortifruti</option>
            <option>Cozinha - Carnes</option><option>Cozinha - Café da manhã</option>
            <option>Cozinha - Temperos</option><option>Banheiro - Higiene pessoal</option>
            <option>Banheiro - Cosméticos</option><option>Banheiro - Limpeza</option>
            <option>Lavanderia</option><option>Casa - Limpeza</option>
            <option>Casa - Utilitários</option><option>Farmácia / Remédios</option>
          </select>
          <button id="btnIniciarInventario">Iniciar inventário</button>
          <div id="avisoInventario" class="aviso"></div>
        </div>
        <div id="invPassoItens" class="oculto">
          <div class="titulo-secao" id="invSubtitulo"></div>
          <div id="invItens"></div>
          <div style="margin-top:16px;display:flex;gap:8px">
            <button id="btnConcluirInventario">Concluir inventário</button>
            <button id="btnVoltarLocal" class="secundario">Voltar</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
