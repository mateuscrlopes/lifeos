<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS</title>
  <style>
    :root {
      --fundo: #f5f6f8;
      --cartao: #ffffff;
      --texto: #1f2430;
      --suave: #6b7280;
      --linha: #e5e7eb;
      --acao: #2f6f4f;
      --acao-clara: #e7f1eb;
      --perigo: #b23c3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fundo);
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
    }
    .envolto {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
    header .quem { font-size: 13px; color: var(--suave); }
    .cartao {
      background: var(--cartao);
      border: 1px solid var(--linha);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--linha);
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: var(--texto);
    }
    input:focus { outline: 2px solid var(--acao-clara); border-color: var(--acao); }
    .campo { margin-bottom: 12px; }
    button {
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      background: var(--acao);
      color: #fff;
    }
    button.secundario { background: var(--acao-clara); color: var(--acao); }
    button:disabled { opacity: 0.55; cursor: default; }
    .linha-add { display: flex; gap: 8px; }
    .linha-add input { flex: 1; }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 4px;
      border-bottom: 1px solid var(--linha);
    }
    .item:last-child { border-bottom: none; }
    .item .desc { display: flex; flex-direction: column; gap: 2px; }
    .item .nome { font-size: 15px; }
    .item .meta { font-size: 12px; color: var(--suave); }
    .item button {
      background: var(--acao-clara);
      color: var(--acao);
      padding: 7px 12px;
      font-size: 13px;
    }
    .vazio { color: var(--suave); font-size: 14px; text-align: center; padding: 24px 0; }
    .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .aviso.erro { color: var(--perigo); }
    .aviso.ok { color: var(--acao); }
    .titulo-secao { font-size: 13px; color: var(--suave); margin: 4px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .oculto { display: none; }
    .abas { display: flex; gap: 8px; margin-bottom: 16px; }
    .aba {
      flex: 1; background: var(--cartao); color: var(--suave);
      border: 1px solid var(--linha); font-weight: 600; padding: 10px;
    }
    .aba.ativa { background: var(--acao); color: #fff; border-color: var(--acao); }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      color: #fff; white-space: nowrap;
    }
    .est-controles { display: flex; align-items: center; gap: 6px; }
    .est-controles button {
      width: 30px; height: 30px; padding: 0; font-size: 17px; line-height: 1;
      background: var(--acao-clara); color: var(--acao);
    }
    .est-qtd { min-width: 26px; text-align: center; font-size: 15px; }
    .saudacao { font-size: 22px; font-weight: 700; margin: 4px 0 4px; letter-spacing: -0.02em; }
    .card-hoje-titulo {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-hoje-titulo .abrir { font-size: 12px; color: var(--acao); cursor: pointer; font-weight: 600; }
    .mini-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 2px; border-bottom: 1px solid var(--linha); font-size: 14px;
    }
    .mini-item:last-child { border-bottom: none; }
    .mini-item .m-meta { font-size: 12px; color: var(--suave); }
    .tudo-em-dia { text-align: center; padding: 28px 0; color: var(--acao); font-size: 15px; }
    .card-clicavel { cursor: pointer; }
    .card-clicavel:hover { border-color: var(--acao); }
    .rodape-sair { text-align: center; margin-top: 8px; }
    .rodape-sair button { background: none; color: var(--suave); font-weight: 400; font-size: 13px; padding: 4px; }
  </style>
</head>
<body>
  <div class="envolto">
    <header>
      <h1>LifeOS</h1>
      <span class="quem" id="quem"></span>
    </header>

    <!-- TELA DE LOGIN -->
    <section id="telaLogin" class="cartao">
      <div class="titulo-secao">Entrar</div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" placeholder="sua senha" />
      </div>
      <button id="btnEntrar">Entrar</button>
      <div id="avisoLogin" class="aviso"></div>
    </section>

    <!-- AREA LOGADA (abas: Compras e Estoque) -->
    <section id="telaApp" class="oculto">
      <nav class="abas">
        <button class="aba ativa" data-aba="hoje">Hoje</button>
        <button class="aba" data-aba="compras">Compras</button>
        <button class="aba" data-aba="estoque">Estoque</button>
        <button class="aba" data-aba="contas">Contas</button>
      </nav>

      <!-- ABA HOJE -->
      <div id="abaHoje">
        <div id="saudacao" class="saudacao"></div>
        <div id="cardsHoje"></div>
      </div>

      <!-- ABA COMPRAS -->
      <div id="abaCompras" class="oculto">
        <div class="cartao">
          <div class="titulo-secao">Adicionar à lista</div>
          <div class="linha-add">
            <input id="novoItem" type="text" placeholder="Ex.: leite" />
            <button id="btnAdd">Adicionar</button>
          </div>
          <div id="avisoAdd" class="aviso"></div>
        </div>

        <div class="cartao">
          <div class="titulo-secao">Lista de compras</div>
          <div id="itens"></div>
        </div>
      </div>

      <!-- ABA ESTOQUE -->
      <div id="abaEstoque" class="oculto">
        <div class="cartao">
          <div class="titulo-secao">Adicionar ao estoque</div>
          <div class="campo">
            <input id="estNome" type="text" placeholder="Nome, ex.: papel higiênico" />
          </div>
          <div class="linha-add">
            <div style="flex:1">
              <label for="estQtd">Quantidade</label>
              <input id="estQtd" type="number" min="0" step="1" value="0" />
            </div>
            <div style="flex:1">
              <label for="estMin">Mínimo</label>
              <input id="estMin" type="number" min="0" step="1" value="1" />
            </div>
          </div>
          <div style="margin-top:12px">
            <button id="btnAddEstoque">Adicionar ao estoque</button>
          </div>
          <div id="avisoEstoque" class="aviso"></div>
        </div>

        <div class="cartao">
          <div class="titulo-secao">Itens em estoque</div>
          <div id="itensEstoque"></div>
        </div>
      </div>

      <!-- ABA CONTAS -->
      <div id="abaContas" class="oculto">
        <div class="cartao">
          <div class="titulo-secao">Adicionar conta</div>
          <div class="campo">
            <input id="ctNome" type="text" placeholder="Nome, ex.: Energia" />
          </div>
          <div class="linha-add">
            <div style="flex:1">
              <label for="ctValor">Valor (R$)</label>
              <input id="ctValor" type="number" min="0" step="0.01" placeholder="opcional" />
            </div>
            <div style="flex:1">
              <label for="ctVenc">Vencimento</label>
              <input id="ctVenc" type="date" />
            </div>
          </div>
          <div class="campo" style="margin-top:12px">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input id="ctRecorrente" type="checkbox" style="width:auto" />
              Repete todo mês
            </label>
          </div>
          <div>
            <button id="btnAddConta">Adicionar conta</button>
          </div>
          <div id="avisoConta" class="aviso"></div>
        </div>

        <div class="cartao">
          <div class="titulo-secao">Contas</div>
          <div id="itensContas"></div>
        </div>
      </div>

      <div class="rodape-sair">
        <button id="btnSair">Sair</button>
      </div>
    </section>
  </div>

  <!-- Biblioteca do Supabase para o navegador -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
